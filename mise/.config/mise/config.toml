bun = "latest"
awscli = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
uv = "latest"

bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
gh = "latest"
git-lfs = "latest"
go-jsonnet = "latest"
grpcurl = "latest"
herdr = "latest"
hunk = "latest"
hyperfine = "latest"
jj = "latest"
jq = "latest"
just = "latest"
"pypi:pre-commit" = "latest"
ripgrep = "latest"
shellcheck = "latest"
tree-sitter = "latest"
yq = "latest"

"npm:bash-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
lua-language-server = "latest"
"npm:pyright" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
