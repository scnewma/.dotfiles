[ui]
paginate = "never"
default-command = [
  "log",
  "--no-pager",
  "--limit=10",
  "-T",
  "builtin_log_compact ++ if(current_working_copy, diff.summary())",
]
show-cryptographic-signatures = false

[templates]
draft_commit_description = '''
concat(
  coalesce(description, default_commit_description, "\n"),
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.stat(72)),
  ),
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''

[git]
private-commits = 'bookmarks(exact:workspace)'

[aliases]
push = ["git", "push", "--revision", "@"]
pull = ["git", "fetch"]

pr-fetch = ["util", "exec", "--", "bash", "-c", """
set -euo pipefail
jj git fetch
jj bookmark track ${1}@origin
jj new ${1}
""", ""]

pr = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -euo pipefail
BRANCH="$(jj bookmark list --revisions @ --template 'name')"
TEMPLATE=""
[ -f .github/pull_request_template.md ] && TEMPLATE="--template pull_request_template.md"
gh pr create --head $BRANCH --draft $TEMPLATE --editor
""",
  "",
]

[user]
name = "Shaun Newman"

[[--scope]]
--when.commands = ["diff", "log", "show"]
[--scope.ui]
paginate = "auto"
